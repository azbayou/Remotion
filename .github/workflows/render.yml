name: Render Video (Cloud)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Pilih Komposisi Video'
        required: true
        default: 'PUMagrib'
        type: choice
        options:
          - PUMagrib
          - PetakUmpetMagribMV
          - PetakUmpetMaghrib
          - ViralCaptions
          - ViralQuiz
          - ViralFakeChat
          - HelloWorld

jobs:
  render:
    name: Render ${{ inputs.composition }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Render Remotion Video
        run: |
          mkdir -p out
          npx remotion render ${{ inputs.composition }} out/${{ inputs.composition }}.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-video
          path: out/*.mp4
          retention-days: 14

